@if (showBanner) {
  <div class="cookie-banner">
    <div class="cookie-content">
      <span class="cookie-icon">🍪</span>
      <p>
        Evenzoo only uses <strong>strictly necessary</strong> storage to keep you logged in —
        we don't use tracking, advertising, or analytics cookies of any kind.
        Since there's nothing optional to decline, both choices below result in the same experience.
        Read our <a routerLink="/cookie-policy">Cookie Policy</a> for full details.
      </p>
    </div>
    <div class="cookie-actions">
      <button class="btn-decline" (click)="decline()">Essential Only</button>
      <button class="btn-accept" (click)="accept()">Got It</button>
    </div>
  </div>
}
