@if (show) {
  <div class="intro-overlay">
    <video
      #introVideo
      class="intro-video"
      [src]="videoUrl"
      autoplay
      muted
      playsinline
      (ended)="onVideoEnded()"
      (error)="onVideoError()">
    </video>

    <button class="skip-btn" (click)="skip()">
      Skip
      <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
        <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/>
      </svg>
    </button>
  </div>
}
