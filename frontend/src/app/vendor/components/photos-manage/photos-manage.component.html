<app-navbar></app-navbar>
<app-approval-banner></app-approval-banner>

<div class="page-header">
  <h1>Manage Photos</h1>
  <p>Showcase your work to attract more customers</p>
</div>

<div class="photos-container">
  <div class="upload-section">
    <input type="file" id="photoUpload" accept="image/*" (change)="onFileSelected($event)" hidden>
    <label for="photoUpload" class="upload-btn">
      @if (uploading) {
        <mat-spinner diameter="20"></mat-spinner>
        <span>Uploading...</span>
      } @else {
        <mat-icon>add_photo_alternate</mat-icon>
        <span>Upload Photo</span>
      }
    </label>
  </div>

  @if (loading) {
    <div class="loading-container">
      <mat-spinner diameter="40"></mat-spinner>
    </div>
  } @else if (photos.length === 0) {
    <div class="empty-state">
      <span class="empty-icon">📷</span>
      <h3>No photos yet</h3>
      <p>Upload photos of your work to build trust with customers</p>
    </div>
  } @else {
    <div class="photo-grid">
      @for (photo of photos; track photo.id) {
        <div class="photo-item">
          <img [src]="photo.photo_url" alt="Portfolio photo">
          @if (photo.is_cover) {
            <span class="cover-badge">Cover Photo</span>
          }
          <button mat-icon-button class="delete-btn" (click)="deletePhoto(photo.id)">
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      }
    </div>
  }
</div>
